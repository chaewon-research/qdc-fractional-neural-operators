  extreme_s:
  - 0.65
  - 0.85
  - 1.0
  id_alpha:
  - 3.5
  - 4.8
  id_contrast:
  - 0.65
  - 0.9
  high_contrast_alpha:
  - 2.1
  - 3.1
  high_contrast_contrast:
  - 1.0
