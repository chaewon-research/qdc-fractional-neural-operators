model:
  width: 60
  modes: 8
  layers: 5
  hidden: 96
  append_coords: true
  local_kernel: 3
  normalization: GroupNorm
  residual_scale: 0.15
  hidden2: 64
training:
  optimizer: AdamW
  epochs: 180
  batch_size: 32
  lr: 0.0014
  weight_decay: 5.0e-06
  grad_clip: 1.0
  scheduler: cosine
quantization:
  core_bits: 6
  qmin: -31
  qmax: 31
  zero_point: 0
  rounding: round_to_even
  complex_scaling: independent_real_imag
  activation_scale: dynamic_per_signed_frequency_block
  weight_scale: per_signed_frequency_block
metrics:
  epsilon: 1.0e-08
  event_quantile: 0.8
  hf_radial_quantile: 0.65
reproduction_sanity_guards:
  rel_l2_max: 0.08
  residual_max: 0.18
  event_rel_l2_max: 0.1
  role: reproducibility sanity checks; not historical preregistration thresholds
seed_semantics:
  run_seed_controls:
  - model_training_randomness
  - synthetic_data_realization
  data_seed_offsets:
    train: 0
    validation: 10000
    holdout: 30000
  quantization_matching: FP32/Q6-weight/Q6-activation use the same holdout within
    each run
